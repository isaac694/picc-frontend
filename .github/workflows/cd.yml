# Production pipeline for main. Hostinger Node.js Web App redeploys from Git on push;
# this workflow verifies the same build Hostinger will run before/alongside that deploy.
name: CD

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://backend.piccworldwide.org

      - name: Hostinger deploy
        run: |
          echo "Push to main triggers Hostinger Git auto-deploy (install → npm run build → restart)."
          echo "Configure: hPanel → Node.js web app → Build script: build, Output: .next, App type: next."
